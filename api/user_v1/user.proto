syntax = "proto3";

package user_v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "buf/validate/validate.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "auth/pkg/user_v1;user_v1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) ={
    info:{
        title:"User API",
        version:"1.0.0",
        contact: {
            name:"Pavel Voroshilov",
            email: "voroshilov.pavel@gmail.com"
        };
    };

    host:"localhost:50570",
    schemes: HTTP,
    schemes: HTTPS,
    consumes: "application/json",
    produces: "application/json"
};

 
service UserV1 {
    // Создает пользователя
    rpc Store(StoreRequest) returns (StoreResponse) {
        option (google.api.http) = {
            post: "/user/v1/create"
            body: "*"
        };
    }
  
    rpc Get(GetRequest) returns (GetResponse) {
        option (google.api.http) = { get: "/user/v1/{id}" };
    }
    rpc Index(IndexRequest) returns (IndexResponse){
        option (google.api.http) = {   get :"/user/v1/list" };
    }
    rpc Update(UpdateRequest) returns (UpdateResponse) {
        option (google.api.http) = {
            patch: "/user/v1/{id}"
            body: "*"
        };
    }
    rpc Delete(DeleteRequest) returns (DeleteResponse){
        option (google.api.http) = { delete: "/user/v1/{id}" };
    }
  }

  enum Roles {
  USER = 0;
  ADMIN = 1;
   
}

message UserCreate {
    UserData info = 1;
    string password = 2;
    string password_confirm = 3;

}

message UserData {
    // Имя пользователя
    string name = 1 [(buf.validate.field).string = {min_len:1, max_len:7}] ;
    // email пользователя
    string email  = 2 [(buf.validate.field).string  = {email:true, max_len:70}];
    Roles roles = 3;
}


message User {
    int64 id = 1;
    UserData info = 2;
    google.protobuf.Timestamp created_at= 3;
    google.protobuf.Timestamp updated_at= 4;
}

message StoreRequest {
    UserCreate user = 1;
}
message StoreResponse {
    int64 id = 1;
}

message IndexRequest {
    uint64 offset = 1;
    uint64 limit = 2;
}

message IndexResponse {
    repeated User users= 1;
}
 

message GetRequest {
    int64 id = 1;
}

message GetResponse {
    User user= 1;
  
}

message UpdateRequest {
    int64 id = 1;
    google.protobuf.StringValue name = 2 [(buf.validate.field).string = {min_len:1, max_len:7}];
    google.protobuf.StringValue email = 3;
    optional Roles roles = 4;  
}

message UpdateResponse {
    User user= 1;
   }

message DeleteRequest {
    int64 id = 1;
}

message DeleteResponse {
   
   }
 