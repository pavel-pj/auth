syntax = "proto3";

package auth_v1;

option go_package = "auth/pkg/auth_v1;auth_v1";

service AuthV1 {
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc GetRefreshToken(GetRefreshRequest) returns (GetRefreshResponse);
    rpc GetAccessToken(GetRefreshRequest) returns (GetRefreshResponse);
}


message LoginRequest {
    string username =1;
    string password = 2;
}

message LoginResponse {
    string refresh_token = 1;
}

message GetRefreshRequest {
    string refresh_token =1;
}

message GetRefreshResponse {
    string refresh_token =1;
}

message GetAccessRequest {
    string refresh_token =1;
}

message GetAccessResponse {
    string access_token =1;
}

