services:
  postgres:
    image: postgres:18
    container_name: postgres-auth
    restart: unless-stopped
    env_file: .env  
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - VAULT_ADDR=${VAULT_ADDR}
    ports:
       - "${PG_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - auth-net
 
      

      
 

volumes:
  pgdata:

networks:
  auth-net:
    external: true  
